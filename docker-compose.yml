version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: videogen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: ajit
      POSTGRES_PASSWORD: secret123
    ports:
      - "5431:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajit -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: videogen-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    command: >
      /bin/sh -lc "ollama serve & sleep 12 && ollama pull llama3.2 && wait"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: videogen-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mydb?currentSchema=video
      DB_USERNAME: ajit
      DB_PASSWORD: secret123
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2
      COMFYUI_BASE_URL: http://host.docker.internal:8188
    ports:
      - "8091:8091"
    volumes:
      - ./generated:/app/generated
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  ollama:
