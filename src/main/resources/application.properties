server.port=8091
spring.application.name=VideoGenaration
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://ollama:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:llama3.2}

spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/mydb?currentSchema=video}
spring.datasource.username=${DB_USERNAME:ajit}
spring.datasource.password=${DB_PASSWORD:secret123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=video
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

comfyui.base-url=${COMFYUI_BASE_URL:http://host.docker.internal:8188}
comfyui.default-width=1024
comfyui.default-height=576
comfyui.default-steps=20
comfyui.default-cfg=7
