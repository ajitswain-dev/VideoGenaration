<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Script Editor</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        color: #1e293b;
        margin: 0;
        padding: 24px;
      }
      .container {
        max-width: 1100px;
        margin: 0 auto;
      }
      .panel {
        background: white;
        border-radius: 12px;
        box-shadow: 0 6px 24px rgba(15, 23, 42, 0.08);
        padding: 20px;
        margin-bottom: 18px;
      }
      .toolbar {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      input, textarea, select, button {
        font: inherit;
      }
      input, textarea, select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        box-sizing: border-box;
      }
      textarea {
        min-height: 220px;
        resize: vertical;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        cursor: pointer;
        font-weight: 600;
      }
      button.secondary {
        background: #0f172a;
      }
      button.warning {
        background: #b45309;
      }
      .two-col {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 18px;
      }
      .scene-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .scene-item {
        padding: 10px 12px;
        border: 1px solid #dbeafe;
        border-radius: 8px;
        cursor: pointer;
        background: #f8fbff;
      }
      .scene-item.active {
        background: #dbeafe;
        border-color: #93c5fd;
      }
      .status {
        margin-top: 10px;
        font-size: 14px;
        color: #334155;
      }
      @media (max-width: 768px) {
        .two-col {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="panel">
        <h2>Video Script Editor</h2>
        <div class="toolbar" style="margin-bottom:12px;">
          <input id="projectId" type="text" placeholder="Project ID" value="demo-project" />
          <button id="loadProjectBtn">Load project</button>
          <button id="createSampleBtn" class="secondary">Create sample</button>
        </div>

        <div class="two-col">
          <div>
            <label for="projectName"><strong>Project name</strong></label>
            <input id="projectName" type="text" value="AI Product Launch" />
          </div>
          <div>
            <label for="topic"><strong>Topic</strong></label>
            <input id="topic" type="text" value="How AI helps small teams launch faster" />
          </div>
          <div>
            <label for="audience"><strong>Audience</strong></label>
            <input id="audience" type="text" value="Founders and startup teams" />
          </div>
          <div>
            <label for="tone"><strong>Tone</strong></label>
            <input id="tone" type="text" value="confident and clear" />
          </div>
          <div>
            <label for="duration"><strong>Duration</strong></label>
            <input id="duration" type="text" value="30s" />
          </div>
          <div>
            <label for="language"><strong>Language</strong></label>
            <input id="language" type="text" value="English" />
          </div>
        </div>

        <div style="margin-top: 14px;">
          <button id="generateDraftBtn">Generate draft from AI</button>
        </div>
      </div>

      <div class="two-col">
        <div class="panel">
          <h3>Script</h3>
          <textarea id="scriptEditor" spellcheck="false"></textarea>
          <div class="toolbar" style="margin-top: 12px;">
            <button id="saveScriptBtn" class="secondary">Save direct edits</button>
            <button id="applySceneFixBtn" class="warning">Improve selected scene</button>
          </div>
          <div id="status" class="status"></div>
        </div>

        <div class="panel">
          <h3>Scenes</h3>
          <div id="sceneList" class="scene-list"></div>
          <div style="margin-top: 14px;">
            <label for="scenePrompt"><strong>Improvement request</strong></label>
            <textarea id="scenePrompt" rows="5" placeholder="Example: Make this more punchy and 20% shorter."></textarea>
          </div>
        </div>
      </div>
    </div>

    <script>
      const scriptEditor = document.getElementById('scriptEditor');
      const sceneList = document.getElementById('sceneList');
      const scenePrompt = document.getElementById('scenePrompt');
      const statusBox = document.getElementById('status');
      let currentProjectId = 'demo-project';
      let draft = null;
      let selectedSceneIndex = 0;

      const sampleScript = {
        title: 'Launch your AI strategy',
        hook: 'Discover how AI helps small teams move faster.',
        narration: 'In today\'s market, speed matters. This video explains how AI gives founders a clearer edge.',
        scenes: [
          { sequence: 1, visual: 'Founder reviewing a dashboard', narration: 'A founder sees busy work draining their team.', duration: '4s' },
          { sequence: 2, visual: 'AI workflow in action', narration: 'AI automates repetitive tasks and surfaces smarter direction quickly.', duration: '5s' },
          { sequence: 3, visual: 'Productivity dashboard', narration: 'The result is faster decisions, less friction, and a more confident launch.', duration: '5s' }
        ],
        status: 'generated',
        language: 'English'
      };

      function setStatus(message, isError = false) {
        statusBox.textContent = message;
        statusBox.style.color = isError ? '#b91c1c' : '#334155';
      }

      function renderScriptText() {
        scriptEditor.value = JSON.stringify(draft, null, 2);
      }

      function renderSceneList() {
        sceneList.innerHTML = '';
        if (!draft || !Array.isArray(draft.scenes)) {
          return;
        }

        draft.scenes.forEach((scene, index) => {
          const item = document.createElement('div');
          item.className = 'scene-item' + (index === selectedSceneIndex ? ' active' : '');
          item.textContent = `Scene ${index + 1}: ${scene.visual || 'Untitled scene'}`;
          item.addEventListener('click', () => {
            selectedSceneIndex = index;
            renderSceneList();
            renderSelectedScene();
          });
          sceneList.appendChild(item);
        });
      }

      function renderSelectedScene() {
        if (!draft || !Array.isArray(draft.scenes)) return;
        const scene = draft.scenes[selectedSceneIndex];
        if (!scene) return;
        scriptEditor.value = JSON.stringify(draft, null, 2);
      }

      function parseDraftFromEditor() {
        try {
          const parsed = JSON.parse(scriptEditor.value);
          draft = parsed;
          if (!Array.isArray(draft.scenes)) {
            draft.scenes = [];
          }
          if (draft.scenes.length > 0 && selectedSceneIndex >= draft.scenes.length) {
            selectedSceneIndex = 0;
          }
          renderSceneList();
          setStatus('Draft updated locally.');
        } catch (error) {
          setStatus('Invalid JSON in script. Fix the format before saving.', true);
        }
      }

      function createSampleDraft() {
        draft = JSON.parse(JSON.stringify(sampleScript));
        selectedSceneIndex = 0;
        renderScriptText();
        renderSceneList();
        setStatus('Sample script loaded.');
      }

      async function loadProject() {
        currentProjectId = document.getElementById('projectId').value.trim() || 'demo-project';
        try {
          const response = await fetch(`/api/projects/${currentProjectId}`);
          if (!response.ok) {
            throw new Error('Project not found');
          }
          const project = await response.json();
          const loadedDraft = project.currentDraft || project.versions?.[project.versions.length - 1];
          draft = loadedDraft || JSON.parse(JSON.stringify(sampleScript));
          if (!draft || !Array.isArray(draft.scenes)) {
            draft = JSON.parse(JSON.stringify(sampleScript));
          }
          selectedSceneIndex = 0;
          renderScriptText();
          renderSceneList();
          setStatus(`Loaded project ${currentProjectId}.`);
        } catch (error) {
          draft = JSON.parse(JSON.stringify(sampleScript));
          renderScriptText();
          renderSceneList();
          setStatus('Project not found, using sample draft instead.', true);
        }
      }

      async function generateProjectDraft() {
        const projectName = document.getElementById('projectName').value.trim();
        const topic = document.getElementById('topic').value.trim();
        const audience = document.getElementById('audience').value.trim();
        const tone = document.getElementById('tone').value.trim();
        const duration = document.getElementById('duration').value.trim();
        const language = document.getElementById('language').value.trim();

        if (!topic || !audience || !tone || !duration || !language) {
          setStatus('Please fill in topic, audience, tone, duration, and language.', true);
          return;
        }

        const createProjectBody = {
          projectName: projectName || topic,
          topic,
          audience,
          tone,
          duration,
          language,
          style: 'cinematic'
        };

        try {
          setStatus('Creating project...');
          const createResponse = await fetch('/api/projects', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(createProjectBody)
          });

          if (!createResponse.ok) {
            const errorText = await createResponse.text();
            throw new Error(errorText || 'Project creation failed');
          }

          const project = await createResponse.json();
          currentProjectId = project.id;
          document.getElementById('projectId').value = currentProjectId;

          const brief = {
            topic,
            audience,
            tone,
            duration,
            language,
            style: 'cinematic'
          };

          setStatus('Sending brief to AI to generate the script...');
          const draftResponse = await fetch(`/api/projects/${currentProjectId}/draft`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(brief)
          });

          if (!draftResponse.ok) {
            const errorText = await draftResponse.text();
            throw new Error(errorText || 'Draft generation failed');
          }

          draft = await draftResponse.json();
          selectedSceneIndex = 0;
          renderScriptText();
          renderSceneList();
          setStatus(`Project "${project.projectName || projectName}" created and draft generated.`);
        } catch (error) {
          setStatus(error.message || 'Unable to generate draft from AI.', true);
        }
      }

      async function improveSelectedScene() {
        if (!draft || !Array.isArray(draft.scenes) || !draft.scenes[selectedSceneIndex]) {
          setStatus('Select a scene first.', true);
          return;
        }

        const scene = draft.scenes[selectedSceneIndex];
        const requestBody = {
          sceneIndex: selectedSceneIndex,
          sceneText: scene.narration || '',
          improvementRequest: document.getElementById('scenePrompt').value || 'Make this scene more punchy and clear.'
        };

        try {
          const response = await fetch(`/api/projects/${currentProjectId}/scene-improve`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestBody)
          });

          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText || 'Improve scene request failed');
          }

          const result = await response.json();
          draft.scenes[selectedSceneIndex].narration = result.improvedText || scene.narration;
          renderScriptText();
          renderSceneList();
          setStatus(`Scene ${selectedSceneIndex + 1} improved.`);
        } catch (error) {
          setStatus(error.message || 'Unable to improve this scene.', true);
        }
      }

      document.getElementById('saveScriptBtn').addEventListener('click', parseDraftFromEditor);
      document.getElementById('createSampleBtn').addEventListener('click', createSampleDraft);
      document.getElementById('loadProjectBtn').addEventListener('click', loadProject);
      document.getElementById('generateDraftBtn').addEventListener('click', generateProjectDraft);
      document.getElementById('applySceneFixBtn').addEventListener('click', improveSelectedScene);

      createSampleDraft();
    </script>
  </body>
</html>
